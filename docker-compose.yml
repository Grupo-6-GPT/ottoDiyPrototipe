services:
  ottobot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ottobot
    restart: unless-stopped
    ports:
      - "8080:80"
    # OttoBot uses the Web Bluetooth API, which requires a secure context (HTTPS).
    # For local development, localhost is considered secure by browsers.
    # For production, put a reverse proxy with TLS in front of this container.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
